plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seagull.backdeck'
    compileSdk 36

    defaultConfig {
        applicationId 'com.seagull.backdeck'
        minSdk 30
        targetSdk 35
        versionCode 15
        versionName '0.11.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Supplied by LSPosed at runtime; never package framework classes into the APK.
    compileOnly 'io.github.libxposed:api:102.0.0'
}
